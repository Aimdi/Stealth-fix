name: Build APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a release for (e.g. v2.3.2). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Dependencies.kt') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        # Best-effort convenience upload; a hit Actions artifact-storage
        # quota must not block publishing the release (release assets are
        # stored separately and don't count against that quota).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stealth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: app/build/outputs/apk/debug/*.apk
          body: |
            ## What's new in 2.3.6

            Mobile UI redesigned to feel closer to Reddit web on mobile:
            - Reddit orange brand colors (light + dark themes)
            - Full-width post cards on a gray canvas with gaps between posts
            - Compact single-line post header (`r/subreddit · u/author · time`)
            - Title above media; full-bleed images
            - Denser typography and action bar (votes / comments / save)
            - Full-width labeled bottom navigation that slides down on scroll

            Also includes the Reddit anonymous-token auth fix so feeds keep
            loading after Reddit shut down unauthenticated `.json` endpoints.

            This is a debug-signed build intended for sideloading and testing.
